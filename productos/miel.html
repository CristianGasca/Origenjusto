<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Miel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      padding: 20px;
    }

    .card {
      max-width: 650px;
      margin: auto;
      background: white;
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    img {
      width: 100%;
      max-height: 380px;
      border-radius: 18px;
      object-fit: cover;
    }

    h1 {
      color: #2563EB;
    }

    .precio {
      font-size: 26px;
      font-weight: bold;
      color: #16A34A;
    }

    .subtitulo {
      color: #333;
      margin-top: 24px;
    }

    p {
      color: #444;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="" alt="Miel">

    <h1>Miel</h1>

    <p class="precio">$110</p>

    <h3 class="subtitulo">Descripción</h3>
    <p>Miel Artezanal</p>

    <h3 class="subtitulo">Historia del producto</h3>
    <p>Miel artezanal elaborada en Ticul desde la decada de los 70s, por una familia de apicultores</p>

    <h3 class="subtitulo">Localidad donde se elaboró</h3>
    <p>Ticul Yucatan</p>
  </div>
</body>
</html>
