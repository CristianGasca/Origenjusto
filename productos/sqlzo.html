<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sqlzo</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6fa;
  padding: 20px;
}
.card {
  max-width: 700px;
  margin: auto;
  background: white;
  border-radius: 24px;
  padding: 25px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}
img {
  width: 100%;
  max-height: 380px;
  border-radius: 18px;
  object-fit: cover;
  margin-top: 10px;
}
h1 { color: #2563EB; }
.precio {
  font-size: 26px;
  font-weight: bold;
  color: #16A34A;
}
.subtitulo {
  color: #333;
  margin-top: 24px;
}
p {
  color: #444;
  line-height: 1.6;
}
.costos {
  background: #f1f5f9;
  padding: 15px;
  border-radius: 16px;
}
</style>
</head>
<body>
  <div class="card">
    <img src="https://CristianGasca.github.io/Origenjusto/imagenes/sqlzo_producto.jpg" alt="Sqlzo">
    <h1>Sqlzo</h1>
    <p class="precio">Precio sugerido: $2170.00</p>

    <h3 class="subtitulo">Descripción</h3>
    <p>soberbio </p>

    <h3 class="subtitulo">Localidad donde se elaboró</h3>
    <p>bocoba </p>

    <h3 class="subtitulo">Proceso de producción</h3>
    <p>qbsvvs</p>

    <img src="https://CristianGasca.github.io/Origenjusto/imagenes/sqlzo_proceso.jpg" alt="Proceso de producción">

    <h3 class="subtitulo">Costos</h3>
    <div class="costos">
      <p><strong>Costo total:</strong> $1550</p>
      <p><strong>Precio sugerido:</strong> $2170.00</p>
    </div>
  </div>
</body>
</html>
